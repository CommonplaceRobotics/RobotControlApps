# Precondition:
# - The Conan lock file (conan_windows.lock) must exist.

name: Build and Test Apps for Windows

on:
  push:
    branches: [ "master", "v1*", "v2*", "v3*", "ci" ]
    paths:
      - ".github/**"
      - 'control_cpp/**'
      - 'minimal_cpp/**'
      - 'monitor_cpp/**'
  pull_request:
    branches: [ "master", "v1*", "v2*", "v3*" ]
    paths:
      - ".github/**"
      - 'control_cpp/**'
      - 'minimal_cpp/**'
      - 'monitor_cpp/**'

jobs:
  # Bereitet die Abhängigkeiten für Windows vor.
  # Dies ist ein separater Job, da dies sehr lange dauern (30-60 Min, falls alles gebaut werden muss) kann und das Ergebnis gecached werden soll, auch wenn das Bauen später fehlschlägt.
  build_dependencies:
    runs-on: CPR_Windows11
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - uses: CommonplaceRobotics/Action_Build_Conan_Dependencies/Windows@v2
      with:
        lockfile: 'conan_windows.lock'
        cache_key: conan-${{ runner.os }}-${{ hashFiles('**/conan_windows.lock', '**/conanfile.py') }}
        path: |
          control_cpp
          minimal_cpp
          monitor_cpp
        cache_paths: |
          ~/.conan2
          control_cpp/out
          minimal_cpp/out
          monitor_cpp/out


  # Builds the Minimal App
  build_minimal_app:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: build_dependencies

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Get the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Restore cached dependencies
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.conan2
          minimal_cpp/out
          monitor_cpp/out
          control_cpp/out
        key: conan-${{ runner.os }}-${{ hashFiles('**/conan_windows.lock', '**/conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-
        fail-on-cache-miss: true

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Configure CMake
      run: |
        cd minimal_cpp
        cp ..\.github\workflows\CMakePresets_Windows.json CMakePresets.json
        cmake --preset conan-windows-x86_64-release .

    - name: Build App
      run: |
        cd minimal_cpp/out/build/Windows/Release
        cmake --build . --target minimalapp.exe

    - name: Package App
      run: |
        cd minimal_cpp
        mkdir -p package/minimal_cpp
        cp rcapp.xml package/minimal_cpp/
        cp ui.xml package/minimal_cpp/
        cp Licenses_SampleApps.pdf package/minimal_cpp/
        cp out/build/Windows/Release/minimalapp.exe package/minimal_cpp/
        cd package

    - name: Export Package
      uses: actions/upload-artifact@v7
      with:
        name: minimal_app_windows
        path: minimal_cpp/package

    - name: Export CMake build directory for SBOM
      uses: actions/upload-artifact@v7
      with:
        name: INTERNAL_CMake_build_dir_minimal
        path: minimal_cpp/out/build


  # Builds the Monitor App
  build_monitor_app:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: build_dependencies

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore cached dependencies
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.conan2
          minimal_cpp/out
          monitor_cpp/out
          control_cpp/out
        key: conan-${{ runner.os }}-${{ hashFiles('**/conan_windows.lock', '**/conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-
        fail-on-cache-miss: true

    - name: Get the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Configure CMake
      run: |
        cd monitor_cpp
        cp ..\.github\workflows\CMakePresets_Windows.json CMakePresets.json
        cmake --preset conan-windows-x86_64-release .

    - name: Build App
      run: |
        cd monitor_cpp/out/build/Windows/Release
        cmake --build . --target monitorapp

    - name: Package App
      run: |
        cd monitor_cpp
        mkdir -p package/monitor_cpp
        cp rcapp.xml package/monitor_cpp/
        cp ui.xml package/monitor_cpp/
        cp Licenses_SampleApps.pdf package/monitor_cpp/
        cp out/build/Windows/Release/monitorapp.exe package/monitor_cpp/
        cd package

    - name: Export Package
      uses: actions/upload-artifact@v7
      with:
        name: monitor_app_windows
        path: monitor_cpp/package

    - name: Export CMake build directory for SBOM
      uses: actions/upload-artifact@v7
      with:
        name: INTERNAL_CMake_build_dir_monitor
        path: monitor_cpp/out/build


  # Builds the Control App
  build_control_app:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: build_dependencies

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore cached dependencies
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.conan2
          minimal_cpp/out
          monitor_cpp/out
          control_cpp/out
        key: conan-${{ runner.os }}-${{ hashFiles('**/conan_windows.lock', '**/conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-
        fail-on-cache-miss: true

    - name: Get the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Configure CMake
      run: |
        cd control_cpp
        cp ..\.github\workflows\CMakePresets_Windows.json CMakePresets.json
        cmake --preset conan-windows-x86_64-release .

    - name: Build App
      run: |
        cd control_cpp/out/build/Windows/Release
        cmake --build . --target controlapp

    - name: Package App
      run: |
        cd control_cpp
        mkdir -p package/control_cpp
        cp rcapp.xml package/control_cpp/
        cp ui.xml package/control_cpp/
        cp Licenses_SampleApps.pdf package/control_cpp/
        cp SampleProgram.xml package/control_cpp/
        cp out/build/Windows/Release/controlapp.exe package/control_cpp/
        cd package

    - name: Export Package
      uses: actions/upload-artifact@v7
      with:
        name: control_app_windows
        path: control_cpp/package

    - name: Export CMake build directory for SBOM
      uses: actions/upload-artifact@v7
      with:
        name: INTERNAL_CMake_build_dir_control
        path: control_cpp/out/build

