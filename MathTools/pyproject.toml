[project]
name = "math_tools"
version = "14.6.7"
description = "Math extensions for the igus Robot Control"
authors = [
    {name = "MAB",email = "support@commonplacerobotics.de"}
]
readme = "README.md"
requires-python = ">=3.9.2"
license = "MIT"
dependencies = [
	"grpcio (==1.64.1)",
]

[dependency-groups]
dev = [
    "grpcio-tools (==1.64.1)"
]
test = [
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.poetry]
packages = [{include = "math_tools_app", from = "src"}]
package-mode=false
name = "math_tools"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
